*{box-sizing:border-box}body{margin:0}header{padding:24px 28px 18px;background:#111827;border-bottom:1px solid var(--line)}h1{font-size:22px;font-weight:650;letter-spacing:-.025em;margin:0 0 16px;color:#f1f5f9}select,button{font:inherit;color:inherit;min-height:36px;padding:7px 12px;border:1px solid #334155;border-radius:9px;background:#0f172a;max-width:100%}select{margin-right:6px}button{cursor:pointer;transition:background .15s,border-color .15s}button:hover{background:#1e293b;border-color:#38bdf8}button:focus-visible,select:focus-visible{outline:3px solid #38bdf855;outline-offset:3px}#save{background:var(--blue);border-color:var(--blue);color:#070b14;font-weight:600}#save:hover{background:#7dd3fc}canvas{width:100%;height:61vh;min-height:260px;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}p{max-width:1050px;line-height:1.65}footer{padding:18px 28px 24px;border-top:1px solid var(--line);background:#111827;color:#94a3b8;font-size:12px}footer p{margin:9px 0 0;color:#f1f5f9;font-variant-numeric:tabular-nums}#sectionInfo{font-size:12px;color:#94a3b8;margin:12px 0 0;overflow-wrap:anywhere}@media(max-width:600px){header{padding:18px}h1{font-size:20px}select{width:100%;margin:0 0 10px}footer{padding:16px 18px}canvas{height:52vh}button{min-height:40px}}

<header><h1 id="name"></h1><select id="section" aria-label="查看截面"></select> <button id="reset">重置视角</button> <button id="save">保存图片</button><p id="sectionInfo"></p></header>
<canvas id="view" aria-label="可拖动旋转、滚轮缩放的三维机翼"></canvas><footer>拖动旋转，滚轮缩放；橙色为选中截面。厚度、弯度和安装角用于外观展示，AVL 仍按薄升力面求解。长度保持模型真实比例。<p id="reference"></p></footer>
<script>
const data=__WING_DATA__, canvas=document.getElementById('view'),ctx=canvas.getContext('2d');let az=.75,el=.5,zoom=1,drag=null;
document.getElementById('name').textContent=data.name;const menu=document.getElementById('section');data.sections.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.label;menu.append(o)});document.getElementById('reference').textContent='参考面积 '+data.reference.area.toFixed(4)+' · 平均气动弦 '+data.reference.chord.toFixed(4)+' · 翼展 '+data.reference.span.toFixed(4);
const points=data.triangles.flat(),lo=[0,1,2].map(k=>Math.min(...points.map(p=>p[k]))),hi=[0,1,2].map(k=>Math.max(...points.map(p=>p[k]))),center=lo.map((v,k)=>(v+hi[k])/2),extent=Math.max(...hi.map((v,k)=>v-lo[k]));
function draw(){const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.fillStyle='#070b14';ctx.fillRect(0,0,w,h);const scale=Math.min(w*.85,h*.85)/extent*zoom;
function project(p){const[x,y,z]=p.map((v,k)=>v-center[k]);const u=y*Math.cos(az)+x*Math.sin(az),v=x*Math.cos(az)-y*Math.sin(az);return[w/2+u*scale,h/2+(v*Math.sin(el)-z*Math.cos(el))*scale,v*Math.cos(el)+z*Math.sin(el)]}
const faces=data.triangles.map(t=>t.map(project)).sort((a,b)=>b.reduce((s,p)=>s+p[2],0)-a.reduce((s,p)=>s+p[2],0));for(const t of faces){ctx.beginPath();t.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();const shade=Math.round(45+20*Math.sin(t[0][2]));ctx.fillStyle=`rgb(${Math.max(15,shade-18)} ${shade+25} ${Math.min(255,shade+65)})`;ctx.fill();ctx.strokeStyle='rgba(56,189,248,.22)';ctx.lineWidth=.45;ctx.stroke()}
const section=data.sections[Number(menu.value)||0];if(section){ctx.beginPath();section.ring.map(project).forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle='#f59e0b';ctx.lineWidth=2.6;ctx.stroke();document.getElementById('sectionInfo').textContent=section.label}}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;az+=(e.clientX-drag[0])*.008;el=Math.max(-1.5,Math.min(1.5,el+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.25,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));draw()};menu.onchange=draw;document.getElementById('reset').onclick=()=>{az=.75;el=.5;zoom=1;draw()};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='wing-preview.png';a.href=canvas.toDataURL();a.click()};addEventListener('resize',draw);draw();
</script></html>
