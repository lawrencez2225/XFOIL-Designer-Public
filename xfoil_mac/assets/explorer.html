<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XFOIL · 翼型分析</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;color:#1d1d1f;background:#f5f5f7;color-scheme:light;--blue:#007aff;--line:#e5e5ea;--muted:#6e6e73}
*{box-sizing:border-box}body{margin:0}header{padding:26px max(24px,calc((100vw - 1460px)/2));background:#fff;border-bottom:1px solid var(--line);display:flex;gap:24px;justify-content:space-between;align-items:center}h1{font-size:25px;letter-spacing:-.035em;font-weight:650;margin:0}header p{margin:6px 0 0;color:var(--muted);font-size:13px}.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:7px 12px;white-space:nowrap}main{max-width:1540px;margin:auto;padding:28px 3%}.toolbar{display:flex;gap:24px;flex-wrap:wrap;align-items:end;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 2px 8px #00000003}label{display:block;font-size:12px;font-weight:500;color:var(--muted)}select,button{font:inherit;border:1px solid #d2d2d7;border-radius:9px;background:#fff;padding:9px 12px;color:#1d1d1f;max-width:100%;min-height:40px}select{min-width:240px;margin-top:6px}button{cursor:pointer;background:var(--blue);color:#fff;border-color:var(--blue);font-size:13px;font-weight:500;transition:background .15s}button:hover{background:#0069d9}button:disabled{background:#e5e5ea;border-color:#e5e5ea;color:#86868b;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #007aff55;outline-offset:3px}.slider{flex:1;min-width:220px;padding-bottom:5px}input[type=range]{width:100%;accent-color:var(--blue);margin-top:12px}input[type=checkbox]{accent-color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:2px 0 22px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}.stat small{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;font-weight:600;letter-spacing:-.04em;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);padding:22px;border-radius:18px;min-width:0;box-shadow:0 2px 8px #00000003}.panel h2{font-size:16px;letter-spacing:-.015em;font-weight:600;margin:0 0 6px}.panel p{font-size:12px;color:var(--muted);margin:5px 0 12px}svg{width:100%;height:auto;display:block}#status{padding:16px 2px;font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--muted)}#status.missing{color:#b45309}.compare{margin:20px 0;display:flex;gap:8px;flex-wrap:wrap}.compare label{display:flex;align-items:center;border:1px solid var(--line);border-radius:18px;background:#fff;padding:7px 12px;font-size:12px;cursor:pointer}.compare input{margin:0 7px 0 0}footer{padding:24px 2px 8px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}footer p{margin:8px 0}#path{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:11px}.dot{cursor:pointer}.dot:focus{outline:none;stroke:#f28c00;stroke-width:3}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat strong{font-size:23px}.grid{gap:16px}.panel{padding:16px}}
@media(max-width:700px){header{padding:22px 18px;align-items:start}h1{font-size:23px}.tag{display:none}main{padding:18px 14px}.grid{grid-template-columns:1fr}.toolbar{padding:18px;gap:18px;border-radius:16px}.toolbar>div{width:100%}.toolbar>button{width:100%}select{width:100%;min-width:0}.slider{min-width:0}.stats{gap:8px;margin-bottom:16px}.stat{padding:13px;border-radius:13px}.stat strong{font-size:20px}.panel{border-radius:16px}.compare{margin:16px 0}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body>
<header><div><h1>XFOIL · 翼型分析</h1><p>极曲线、压力分布与收敛诊断</p></div><span class="tag">离线结果 · 无需联网</span></header>
<main><section class="toolbar"><div><label for="case">当前算例</label><select id="case"></select></div><div class="slider"><label for="alpha">攻角 <strong id="alpha-value"></strong></label><input id="alpha" aria-label="攻角" type="range" min="0" value="0" step="1"></div><button id="export">导出当前极曲线 CSV</button></section>
<div id="status" role="status" aria-live="polite"></div><section class="stats" id="stats"></section>
<div class="grid"><section class="panel"><h2>翼型与压力矢量</h2><p>正压指向翼面，负压离开翼面；矢量长度为展示缩放</p><svg id="geometry" viewBox="0 0 620 320" role="img" aria-label="翼型与压力矢量"></svg></section><section class="panel"><h2>压力分布 Cp</h2><p>负值向上；缺失 Cp 不绘制</p><svg id="cp" viewBox="0 0 620 320" role="img" aria-label="压力系数分布"></svg></section></div>
<div id="compare" class="compare" aria-label="对比算例"></div>
<div class="grid"><section class="panel"><h2>升力与攻角</h2><p>点击当前算例的数据点，联动查看对应攻角</p><svg id="cl" viewBox="0 0 620 320" role="img" aria-label="升力曲线"></svg></section><section class="panel"><h2>阻力极曲线</h2><p>同色对应同一算例；缺失计算点处断线</p><svg id="polar" viewBox="0 0 620 320" role="img" aria-label="阻力极曲线"></svg></section></div>
<footer><div id="path"></div><p>显示已保存的计算结果。未收敛不等于已确定发生失速；截面升阻比不等于整机升阻比。</p></footer></main>
<script id="data" type="application/json">__XFOIL_DATA__</script>
<script>
'use strict';
const cases=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const statuses={ok:'已完成',partial_convergence:'部分收敛',no_converged_points:'未收敛',needs_attention:'需要检查',invalid_outputs:'输出无效',missing_cp:'压力分布缺失',timeout:'超时',interrupted:'已中断',cancelled:'已取消',failed:'失败'};
const colors=['#007aff','#b85a00','#8250df','#248a3d','#c93670','#636366'];let active=0,index=0;const compared=new Set();
function el(tag,attrs={},text=''){const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n;}
function label(svg,x,y,text,attrs={}){svg.append(el('text',{x,y,'font-size':11,fill:'#6e6e73',...attrs},text));}
function fmt(v,n=4){return Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:n}):'—';}
function plot(id,series,xlabel,ylabel,invert=false,equal=false){const svg=$(id);svg.replaceChildren();const all=series.flatMap(s=>s.points.filter(p=>p&&Number.isFinite(p[0])&&Number.isFinite(p[1])));if(!all.length&&xlabel==='alpha'){all.push(...cases[active].samples.map(s=>[s.alpha,0]));}if(!all.length){label(svg,310,155,'此攻角没有可用数据',{'text-anchor':'middle','font-size':15});return;}
let xmin=Math.min(...all.map(p=>p[0])),xmax=Math.max(...all.map(p=>p[0])),ymin=Math.min(...all.map(p=>p[1])),ymax=Math.max(...all.map(p=>p[1]));if(xlabel==='alpha'){xmin=Math.min(xmin,...cases[active].samples.map(s=>s.alpha));xmax=Math.max(xmax,...cases[active].samples.map(s=>s.alpha));}let dx=xmax-xmin||.1,dy=ymax-ymin||.1;xmin-=dx*.06;xmax+=dx*.06;ymin-=dy*.09;ymax+=dy*.09;
const L=63,R=598,T=25,B=275;if(equal){let span=Math.max((xmax-xmin)/(R-L),(ymax-ymin)/(B-T));let cx=(xmin+xmax)/2,cy=(ymin+ymax)/2;xmin=cx-span*(R-L)/2;xmax=cx+span*(R-L)/2;ymin=cy-span*(B-T)/2;ymax=cy+span*(B-T)/2;}
const X=x=>L+(x-xmin)/(xmax-xmin)*(R-L),Y=y=>invert?T+(y-ymin)/(ymax-ymin)*(B-T):B-(y-ymin)/(ymax-ymin)*(B-T);
for(let i=0;i<=4;i++){let x=xmin+i*(xmax-xmin)/4,y=ymin+i*(ymax-ymin)/4;svg.append(el('path',{d:`M${X(x)},${T}V${B} M${L},${Y(y)}H${R}`,stroke:'#e5e5ea',fill:'none'}));label(svg,X(x),B+17,fmt(x,3),{'text-anchor':'middle'});label(svg,L-8,Y(y)+4,fmt(y,3),{'text-anchor':'end'});}label(svg,(L+R)/2,313,xlabel,{'text-anchor':'middle'});label(svg,8,16,ylabel);
for(const s of series){let path='',pen=false;for(const p of s.points){if(!p||!Number.isFinite(p[0])||!Number.isFinite(p[1])){pen=false;continue;}path+=(pen?'L':'M')+X(p[0])+','+Y(p[1]);pen=true;}svg.append(el('path',{d:path,fill:'none',stroke:s.color||colors[0],'stroke-width':s.width||1.7,'stroke-dasharray':s.dash||''}));if(s.click){s.points.forEach((p,i)=>{if(!p){if(xlabel!=='alpha')return;const x=X(cases[active].samples[i].alpha),y=B-6,cross=el('path',{d:`M${x-5},${y-5}L${x+5},${y+5}M${x-5},${y+5}L${x+5},${y-5}`,stroke:'#c9342b','stroke-width':3,class:'dot',tabindex:0,role:'button','aria-label':`未收敛攻角 ${cases[active].samples[i].alpha}°`});cross.addEventListener('click',()=>setIndex(i));cross.addEventListener('keydown',e=>{if(e.key==='Enter')setIndex(i)});svg.append(cross);return;}const circle=el('circle',{cx:X(p[0]),cy:Y(p[1]),r:i===index?5:3,fill:i===index?'#f28c00':s.color,class:'dot',tabindex:0,role:'button','aria-label':`攻角 ${cases[active].samples[i].alpha}°`});circle.addEventListener('click',()=>setIndex(i));circle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setIndex(i);}});svg.append(circle);});}}
return {svg,X,Y};}
function setIndex(i){index=i;$('alpha').value=i;render();}
function render(){const c=cases[active],s=c.samples[index];$('alpha-value').textContent=fmt(s.alpha,3)+'°';$('path').textContent=c.directory;$('status').className=s.row?'':'missing';$('status').textContent=`${c.condition} · 算例状态：${statuses[c.status]||c.status} · `+(s.row?'当前攻角已收敛'+(s.cp.length?'':'，Cp 缺失'):'当前攻角没有收敛结果');const d=s.diagnostic||{},labels={converged:'已收敛',oscillating_iterations:'残差往复振荡',iteration_limit_or_failed_warm_start:'达到迭代上限或起步失败',timeout:'超时',interrupted:'已中断',missing_cp:'压力分布缺失',invalid_boundary_layer:'边界层数据无效',no_converged_record:'未找到收敛记录'};const initializations=d.initialization_history||[],resetNotice=d.recovered_by_init===true?' · 边界层重新初始化后收敛':initializations.includes('INIT')?' · 曾尝试边界层重新初始化':'';$('status').textContent += `\n诊断：${labels[d.status]||d.status||'暂无记录'}${resetNotice} · 尝试 ${d.attempts||0} 次 · 逼近起点 ${(d.seed_history||[]).map(a=>a===null?'初始扫描':a+'°').join(' → ')} · 最后残差 ${fmt(d.last_residual,6)}`;if(d.boundary_layer_error)$('status').textContent+='\n边界层：'+d.boundary_layer_error;$('stats').replaceChildren();for(const[k,v]of[['CL',s.row?.CL],['CD',s.row?.CD],['CM',s.row?.CM],['CL / CD',s.row?.CD>0?s.row.CL/s.row.CD:null],['Re',s.re],['Mach',s.mach]]){const n=document.createElement('div');n.className='stat';const small=document.createElement('small');small.textContent=k;const strong=document.createElement('strong');strong.textContent=fmt(v,k==='CD'?6:4);n.append(small,strong);$('stats').append(n);}
const geo=plot('geometry',[{points:s.geometry,color:'#3a3a3c',width:2},{points:s.vectors.flatMap(v=>[[v[0],v[1]],[v[0]+v[2],v[1]+v[3]]]),color:'transparent'}], 'x/c','y/c',false,true);if(geo){const{svg,X,Y}=geo;for(const[x,y,u,v]of s.vectors){const x1=X(x),y1=Y(y),x2=X(x+u),y2=Y(y+v),angle=Math.atan2(y2-y1,x2-x1),h=4;svg.append(el('path',{d:`M${x1},${y1}L${x2},${y2}M${x2-h*Math.cos(angle-.5)},${y2-h*Math.sin(angle-.5)}L${x2},${y2}L${x2-h*Math.cos(angle+.5)},${y2-h*Math.sin(angle+.5)}`,stroke:'#007aff','stroke-width':1,fill:'none'}));}}
let cpseries=[];if(s.cp.length){const le=s.cp.reduce((a,p,i)=>p[0]<s.cp[a][0]?i:a,0);cpseries=[{points:s.cp.slice(0,le+1),color:'#007aff'},{points:s.cp.slice(le),color:'#b85a00'}];}plot('cp',cpseries,'x/c','Cp',true);
const selected=[active,...[...compared].filter(i=>i!==active)];for(const[id,xkey,ykey]of[['cl','alpha','CL'],['polar','CD','CL']])plot(id,selected.map(i=>({points:cases[i].samples.map(t=>t.row?[xkey==='alpha'?t.alpha:t.row[xkey],t.row[ykey]]:null),color:colors[i%colors.length],click:i===active,dash:i===active?'':'5 3'})),xkey,ykey);}
for(const[cidx,c]of cases.entries()){const option=document.createElement('option');option.value=cidx;option.textContent=c.name+' · '+c.condition;$('case').append(option);const l=document.createElement('label'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.setAttribute('aria-label','对比 '+c.name+' '+c.condition);checkbox.addEventListener('change',()=>{checkbox.checked?compared.add(cidx):compared.delete(cidx);render();});l.style.color=colors[cidx%colors.length];l.append(checkbox,document.createTextNode(c.name+' · '+c.condition));$('compare').append(l);}
$('case').addEventListener('change',()=>{active=Number($('case').value);index=0;$('alpha').max=cases[active].samples.length-1;$('alpha').value=0;render();});$('alpha').addEventListener('input',()=>setIndex(Number($('alpha').value)));
$('export').addEventListener('click',()=>{let lines=['alpha,CL,CD,CM,Re,Mach,status'];for(const s of cases[active].samples)lines.push([s.alpha,s.row?.CL??'',s.row?.CD??'',s.row?.CM??'',s.re??'',s.mach??'',s.row?'converged':'missing'].join(','));const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='xfoil-polar.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
if(cases.length&&cases[0].samples.length){$('alpha').max=cases[0].samples.length-1;render();}else{$('status').textContent='没有可显示的计算点';$('export').disabled=true;}
</script></body></html>
