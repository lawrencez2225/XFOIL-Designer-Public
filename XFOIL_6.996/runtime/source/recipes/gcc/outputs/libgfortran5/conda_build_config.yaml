CI: azure
CONDA_BUILD_SYSROOT: /Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX11.0.sdk
MACOSX_DEPLOYMENT_TARGET: '11.0'
MACOSX_SDK_VERSION: '11.0'
TARGET: arm64-apple-darwin20.0.0
binutils_version: '2.45'
build_platform: osx-64
c_compiler: clang
c_stdlib: macosx_deployment_target
c_stdlib_version: '11.0'
channel_sources: conda-forge/label/sysroot-with-crypt,conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cross_target_cxx_stdlib: libcxx
cross_target_platform: osx-arm64
cross_target_stdlib: None
cross_target_stdlib_version: '0'
cxx_compiler: clangxx
extend_keys:
- pin_run_as_build
- ignore_build_only_deps
- ignore_version
- extend_keys
fortran_compiler: gfortran
gcc_maj_ver: '15'
gcc_version: 15.2.0
ignore_build_only_deps:
- numpy
- python
libgfortran_soname: '5'
libgomp_ver: 1.0.0
lua: '5'
macos_machine: arm64-apple-darwin20.0.0
numpy: '1.26'
openmp_ver: '4.5'
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
python: '3.12'
r_base: '3.5'
target_platform: osx-arm64
with_conda_specs: 'false'
zip_keys:
- - cross_target_stdlib_version
  - cross_target_stdlib
  - cross_target_cxx_stdlib
  - TARGET
  - cross_target_platform
- - gcc_version
  - gcc_maj_ver
  - libgfortran_soname
